{% extends "base.html" %}
{% load static %}

{% block title %}Sesión Cerrada - GIQYMA Inventario{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden text-center">
            <div class="bg-secondary bg-gradient p-4 text-white">
                <div class="fs-1 mb-2"><i class="bi bi-door-closed"></i></div>
                <h4 class="fw-bold mb-0">Sesión Finalizada</h4>
                <p class="text-white-50 small mb-0">GIQYMA - Universidad de Cartagena</p>
            </div>
            <div class="card-body p-4 p-md-5">
                <p class="text-muted small mb-4">
                    Ha cerrado sesión correctamente en el sistema de inventario.
                </p>
                <div class="d-grid mt-4">
                    <a href="{% url 'login' %}" class="btn btn-primary py-2 fw-semibold" style="background-color: #0a3d62; border-color: #0a3d62;">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Volver a Iniciar Sesión
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
